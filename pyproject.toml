[project]
name = "miedipole-py"
version = "0.1.0"
description = "Python port of MieDipole — Generalized Mie Theory with electric dipole source"
readme = "README.md"
requires-python = ">=3.9,<3.13"
dependencies = [
    "numpy==1.26.4",
    "scipy==1.11.4",
    "matplotlib==3.8.3",
    "pandas==2.1.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = ["tests", "Functions"]
testpaths = ["tests"]
